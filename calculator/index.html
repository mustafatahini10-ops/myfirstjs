<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <!-- <link rel="stylesheet" href="../css/try.css">
        <script src="../js/main.js" defer></script> -->
        <link rel="stylesheet" href="css/try.css">
<script src="js/main.js" defer></script>
    </head>
    <body>
        <main>
            <p class="typo">Calculator</p>
            <p class="screen"></p>
            <div class="components">
            <button class="op mul">*</button> 
            <button class="op divi">/</button>
            <button class="op sup">-</button>
            <button class="op add">+</button>
            <button class="num nine">9</button>
            <button class="num eight">8</button>
            <button class="num seven">7</button>
            <button class="num six">6</button>
            <button class="num five">5</button>
            <button class="num four">4</button>
            <button class="num three">3</button>
            <button class="num two">2</button>
            <button class="num one">1</button>
            <button class="num zero">0</button>
            <button class="num point">.</button>
            <button class="num equal">=</button>
            <button class="clear c">c</button>
            <button class="del d">del</button>
            </div>
        </main>
    </body>
</html>
